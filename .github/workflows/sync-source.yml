name: Exact Source Sync

on:
  push:
    branches:
      - main
    paths:
      - '.source-sync/**'

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source snapshot
        shell: bash
        run: |
          set -euo pipefail

          if [ -f .source-sync/payload.tar.xz ]; then
            cp .source-sync/payload.tar.xz /tmp/source-sync.tar.xz
          else
            shopt -s nullglob
            chunks=(.source-sync/chunk_*.txt)
            if [ ${#chunks[@]} -eq 0 ]; then
              echo 'No sync payload found; nothing to do.'
              exit 0
            fi
            cat "${chunks[@]}" > /tmp/source-sync.b64
            base64 --decode /tmp/source-sync.b64 > /tmp/source-sync.tar.xz
          fi

          tar -xJf /tmp/source-sync.tar.xz -C .

          while IFS=$'\t' read -r expected path; do
            [ -n "$expected" ] || continue
            if [ ! -f "$path" ]; then
              echo "Missing extracted file: $path" >&2
              exit 1
            fi
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "SHA mismatch: $path expected=$expected actual=$actual" >&2
              exit 1
            fi
          done < .source-sync/manifest.tsv

          touch /tmp/source-sync-ready

      - name: Commit verified snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /tmp/source-sync-ready ]; then
            echo 'No verified source payload; leaving staging files untouched.'
            exit 0
          fi
          rm -rf .source-sync
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Sync verified source snapshot from SAK010'
          git push origin HEAD:main
