name: Scoped UI Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/deploy-requests/ui-production-20260925.approved

permissions:
  contents: read

concurrency:
  group: scoped-ui-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate exact deploy scope
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          test -f public_html/app.php
          test -f public_html/assets/css/sakazuki-ui.css
          test -f public_html/assets/js/nav.js

          echo "Approved production scope:"
          echo "- public_html/assets/css/sakazuki-ui.css"
          echo "- public_html/assets/js/nav.js"

      - name: Resolve production root safely
        shell: bash
        run: |
          set -euo pipefail
          host="${FTP_HOST#ftp://}"
          host="${host#ftps://}"
          host="${host%/}"
          remote="${FTP_REMOTE_DIR#/}"
          remote="${remote%/}"
          sentinel="app.php"

          test_candidate() {
            label="$1"
            base="$2"
            tmp="$(mktemp)"
            if curl --silent --show-error --fail --globoff \
              --connect-timeout 15 --max-time 45 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --output "$tmp" "${base}/${sentinel}" 2>/dev/null; then
              if cmp -s "public_html/${sentinel}" "$tmp"; then
                rm -f "$tmp"
                echo "FTP_BASE_URL=$base" >> "$GITHUB_ENV"
                echo "Production root resolved safely: $label (app.php matches GitHub main)."
                return 0
              fi
              echo "Candidate reachable but sentinel differs: $label"
            fi
            rm -f "$tmp"
            return 1
          }

          if [ -n "$remote" ] && test_candidate "configured login-relative path" "ftp://$host/$remote"; then exit 0; fi
          if [ -n "$remote" ] && test_candidate "configured absolute path" "ftp://$host//$remote"; then exit 0; fi
          if test_candidate "FTP account root" "ftp://$host"; then exit 0; fi
          if test_candidate "public_html below FTP account root" "ftp://$host/public_html"; then exit 0; fi

          echo "Could not identify production public_html safely. Nothing was uploaded."
          exit 2

      - name: Download production backup before upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-ui-backup/assets/css production-ui-backup/assets/js

          for rel in assets/css/sakazuki-ui.css assets/js/nav.js; do
            target="production-ui-backup/$rel"
            mkdir -p "$(dirname "$target")"
            if curl --silent --show-error --fail --globoff \
              --connect-timeout 15 --max-time 45 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --output "$target" "${FTP_BASE_URL}/${rel}" 2>/dev/null; then
              sha256sum "$target" >> production-ui-backup/SHA256SUMS.txt
              echo "$rel: backed up"
            else
              rm -f "$target"
              echo "$rel: MISSING_OR_UNREADABLE_BEFORE_DEPLOY" >> production-ui-backup/MISSING.txt
              echo "$rel: missing/unreadable before deploy"
            fi
          done

      - name: Store production backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-ui-backup-${{ github.run_id }}
          path: production-ui-backup
          if-no-files-found: error
          retention-days: 30

      - name: Upload only the two approved UI files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "assets/css/sakazuki-ui.css"
            "assets/js/nav.js"
          )

          for rel in "${files[@]}"; do
            local_file="public_html/$rel"
            target="${FTP_BASE_URL}/${rel}"
            echo "Uploading $rel"
            curl --silent --show-error --fail --globoff \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --connect-timeout 15 --max-time 120 \
              --ftp-create-dirs \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "$local_file" \
              "$target" >/dev/null
          done

          echo "Exactly two approved UI files uploaded."

      - name: Verify deployed files byte-for-byte over FTP
        shell: bash
        run: |
          set -euo pipefail
          for rel in assets/css/sakazuki-ui.css assets/js/nav.js; do
            tmp="$(mktemp)"
            curl --silent --show-error --fail --globoff \
              --connect-timeout 15 --max-time 45 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --output "$tmp" "${FTP_BASE_URL}/${rel}"
            if ! cmp -s "public_html/$rel" "$tmp"; then
              echo "Verification failed: $rel differs after upload"
              rm -f "$tmp"
              exit 1
            fi
            echo "$rel: MATCH"
            rm -f "$tmp"
          done

      - name: Smoke check public static assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://sakazuki.spwz.online"
          stamp="${GITHUB_SHA}"
          for rel in assets/css/sakazuki-ui.css assets/js/nav.js; do
            code="$(curl --silent --show-error --location \
              --retry 3 --retry-delay 2 \
              --connect-timeout 15 --max-time 45 \
              --output /dev/null --write-out '%{http_code}' \
              "${base}/${rel}?deploy=${stamp}")"
            echo "$rel: HTTP $code"
            if [ "$code" != "200" ]; then
              exit 1
            fi
          done

      - name: Deployment summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Scoped Sakazuki UI production deployment"
            echo
            echo "Deployed exactly two files from main commit ${GITHUB_SHA}:"
            echo "- public_html/assets/css/sakazuki-ui.css"
            echo "- public_html/assets/js/nav.js"
            echo
            echo "A pre-deploy production backup was stored as an Actions artifact for 30 days."
            echo "FTP byte-for-byte verification and public HTTP smoke checks passed."
          } >> "$GITHUB_STEP_SUMMARY"
