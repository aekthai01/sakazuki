name: Product Image Lifecycle Patch

on:
  push:
    branches:
      - fix/product-image-lifecycle-20260924

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.head_commit.message == 'Add product image lifecycle patch runner'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, gd, json, mbstring, mysqli
          coverage: none

      - name: Apply lifecycle patch
        run: python3 tools/apply_product_image_lifecycle_patch.py

      - name: Check generated diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Lint changed PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l public_html/includes/product_image_lifecycle.php
          php -l public_html/includes/functions.php
          php -l public_html/includes/automation.php
          php -l public_html/admin/products.php
          php -l tests/product_image_lifecycle_test.php

      - name: Lint all production PHP
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! php -l "$file" >/tmp/php-lint.out 2>&1; then
              cat /tmp/php-lint.out
              failures=$((failures + 1))
            fi
          done < <(find public_html -type f -name '*.php' -print0)
          echo "PHP files checked: $count"
          test "$failures" -eq 0

      - name: Run all regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*_test.php; do
            echo "==> $test_file"
            php "$test_file"
          done

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore .github/workflows/truemoney-byteindev-ci.yml \
            public_html/includes/product_image_lifecycle.php \
            public_html/includes/functions.php \
            public_html/includes/automation.php \
            public_html/admin/products.php \
            tests/product_image_lifecycle_test.php
          git commit -m "[generated] Fix product image lifecycle"
          git push origin HEAD:${GITHUB_REF_NAME}
