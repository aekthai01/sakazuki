name: FTP Connectivity Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ftp-connectivity-test.yml"

permissions:
  contents: read

jobs:
  test-ftp:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      FTP_HOST: svth01.inwcloud.shop
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: public_html

    steps:
      - name: Validate FTP configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD FTP_REMOTE_DIR; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required FTP setting: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "All required FTP settings are present."

      - name: Test FTP authentication
        shell: bash
        run: |
          set -euo pipefail

          host="${FTP_HOST#ftp://}"
          host="${host#ftps://}"
          host="${host%/}"

          echo "Testing FTP authentication..."

          curl \
            --silent \
            --show-error \
            --fail \
            --connect-timeout 15 \
            --max-time 45 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --list-only \
            "ftp://$host/" \
            >/dev/null

          echo "FTP authentication succeeded."

      - name: Test remote directory
        shell: bash
        run: |
          set -euo pipefail

          host="${FTP_HOST#ftp://}"
          host="${host#ftps://}"
          host="${host%/}"
          remote="${FTP_REMOTE_DIR#/}"

          echo "Testing configured remote directory..."

          if curl \
            --silent \
            --show-error \
            --fail \
            --connect-timeout 15 \
            --max-time 45 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --list-only \
            "ftp://$host/$remote/" \
            >/dev/null
          then
            echo "Remote directory is accessible as a login-relative path."
            exit 0
          fi

          if curl \
            --silent \
            --show-error \
            --fail \
            --connect-timeout 15 \
            --max-time 45 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --list-only \
            "ftp://$host//$remote/" \
            >/dev/null
          then
            echo "Remote directory is accessible as an absolute FTP path."
            exit 0
          fi

          echo "FTP login worked, but FTP_REMOTE_DIR could not be accessed."
          exit 2
