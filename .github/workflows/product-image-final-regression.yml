name: Product Image Final Regression

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/product-image-final-regression.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, mysqli
          coverage: none
      - name: Run final regressions
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/product_image_lifecycle_test.php
          php -l public_html/automation_runner.php
          php tests/product_image_lifecycle_test.php
          failures=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! php -l "$file" >/tmp/php-lint.out 2>&1; then
              cat /tmp/php-lint.out
              failures=$((failures + 1))
            fi
          done < <(find public_html -type f -name '*.php' -print0)
          echo "PHP files checked: $count"
          test "$failures" -eq 0
          for test_file in tests/*.php; do php "$test_file"; done
          git diff --check HEAD~1..HEAD
