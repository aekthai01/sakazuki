name: Product Image Memory Safety Patch

on:
  push:
    branches:
      - fix/product-image-optimizer-memory-20260924
    paths:
      - ".github/workflows/product-image-memory-fix.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fix/product-image-optimizer-memory-20260924
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, mysqli, gd
          coverage: none

      - name: Apply guarded memory-safety patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one target, found {count}')
              p.write_text(s.replace(old, new, 1))

          lifecycle_helper = r'''if (!function_exists('sakazukiParsePhpIniBytes')) {
              function sakazukiParsePhpIniBytes(string $value): int
              {
                  $value = trim($value);
                  if ($value === '' || $value === '-1') return 0;
                  if (preg_match('/\A([0-9]+(?:\.[0-9]+)?)\s*([KMG]?)B?\z/iD', $value, $matches) !== 1) {
                      return max(0, (int) $value);
                  }
                  $number = (float) $matches[1];
                  $unit = strtoupper((string) ($matches[2] ?? ''));
                  $power = $unit === 'G' ? 3 : ($unit === 'M' ? 2 : ($unit === 'K' ? 1 : 0));
                  $bytes = $number * (1024 ** $power);
                  if (!is_finite($bytes) || $bytes >= PHP_INT_MAX) return PHP_INT_MAX;
                  return max(0, (int) floor($bytes));
              }
          }

          if (!function_exists('sakazukiPhpMemoryLimitBytes')) {
              function sakazukiPhpMemoryLimitBytes(): int
              {
                  $raw = ini_get('memory_limit');
                  return sakazukiParsePhpIniBytes(is_string($raw) ? $raw : '');
              }
          }

          if (!function_exists('sakazukiProductImageOptimizationMemoryPlan')) {
              /**
               * Estimate the additional memory needed before asking GD to decode
               * a product image. The estimate is intentionally conservative: GD
               * may keep decoded source/target buffers plus codec scratch memory
               * at the same time. A 192 MiB soft ceiling also protects shared
               * hosting even when PHP itself is configured with a larger limit.
               *
               * Optional memory/current values keep the calculation deterministic
               * in regression tests without changing process ini settings.
               *
               * @return array{safe:bool,estimated_additional_bytes:int,memory_limit_bytes:int,effective_limit_bytes:int,current_usage_bytes:int,reserve_bytes:int,available_bytes:int,target_width:int,target_height:int}
               */
              function sakazukiProductImageOptimizationMemoryPlan(
                  int $width,
                  int $height,
                  int $fileSize,
                  int $maxDimension = 1024,
                  ?int $memoryLimitBytes = null,
                  ?int $currentUsageBytes = null
              ): array {
                  $width = max(0, $width);
                  $height = max(0, $height);
                  $fileSize = max(0, $fileSize);
                  $maxDimension = max(320, min(1600, $maxDimension));
                  $limit = $memoryLimitBytes === null ? sakazukiPhpMemoryLimitBytes() : max(0, $memoryLimitBytes);
                  $current = $currentUsageBytes === null ? max(0, (int) memory_get_usage(true)) : max(0, $currentUsageBytes);
                  $softCeiling = 192 * 1024 * 1024;
                  $effectiveLimit = $limit > 0 ? min($limit, $softCeiling) : $softCeiling;
                  $reserve = max(16 * 1024 * 1024, intdiv($effectiveLimit, 8));

                  if ($width < 1 || $height < 1) {
                      return [
                          'safe' => false,
                          'estimated_additional_bytes' => PHP_INT_MAX,
                          'memory_limit_bytes' => $limit,
                          'effective_limit_bytes' => $effectiveLimit,
                          'current_usage_bytes' => $current,
                          'reserve_bytes' => $reserve,
                          'available_bytes' => max(0, $effectiveLimit - $current - $reserve),
                          'target_width' => 0,
                          'target_height' => 0,
                      ];
                  }

                  $scale = min(1.0, $maxDimension / max($width, $height));
                  $targetWidth = max(1, (int) round($width * $scale));
                  $targetHeight = max(1, (int) round($height * $scale));
                  // 8 bytes/pixel is deliberately above the raw 4-byte truecolor
                  // buffer to cover GD/libjpeg/libpng decode and resample overhead.
                  $sourceBytes = $width * $height * 8;
                  $targetBytes = $targetWidth * $targetHeight * 8;
                  $compressedCopies = $fileSize * 2;
                  $codecOverhead = 16 * 1024 * 1024;
                  $estimated = max(0, (int) ($sourceBytes + $targetBytes + $compressedCopies + $codecOverhead));
                  $available = max(0, $effectiveLimit - $current - $reserve);

                  return [
                      'safe' => $estimated <= $available,
                      'estimated_additional_bytes' => $estimated,
                      'memory_limit_bytes' => $limit,
                      'effective_limit_bytes' => $effectiveLimit,
                      'current_usage_bytes' => $current,
                      'reserve_bytes' => $reserve,
                      'available_bytes' => $available,
                      'target_width' => $targetWidth,
                      'target_height' => $targetHeight,
                  ];
              }
          }

          '''
          replace_once(
              'public_html/includes/product_image_lifecycle.php',
              "if (!function_exists('sakazukiProductImageCountQuery')) {",
              lifecycle_helper + "if (!function_exists('sakazukiProductImageCountQuery')) {",
              'insert memory planning helpers'
          )

          replace_once(
              'public_html/includes/functions.php',
              "$failed = ['success' => false, 'filename' => '', 'mime' => '', 'width' => 0, 'height' => 0, 'optimized' => false];",
              "$failed = ['success' => false, 'filename' => '', 'mime' => '', 'width' => 0, 'height' => 0, 'optimized' => false, 'reason' => ''];",
              'extend optimized-image failure metadata'
          )
          replace_once(
              'public_html/includes/functions.php',
              "    $maxDimension = max(320, min(1600, $maxDimension));\n    if (!is_dir($directory) && !@mkdir($directory, 0755, true) && !is_dir($directory)) return $failed;",
              "    $maxDimension = max(320, min(1600, $maxDimension));\n    if (function_exists('sakazukiProductImageOptimizationMemoryPlan')) {\n        $memoryPlan = sakazukiProductImageOptimizationMemoryPlan($width, $height, strlen($bytes), $maxDimension);\n        if (empty($memoryPlan['safe'])) {\n            $failed['reason'] = 'memory_budget';\n            return $failed;\n        }\n    }\n    if (!is_dir($directory) && !@mkdir($directory, 0755, true) && !is_dir($directory)) return $failed;",
              'guard GD decode with memory plan'
          )
          replace_once(
              'public_html/includes/functions.php',
              'function sakazukiOptimizeLegacyProductImages(int $maxConverted = 3): array',
              'function sakazukiOptimizeLegacyProductImages(int $maxConverted = 1): array',
              'lower optimizer default batch'
          )
          replace_once(
              'public_html/includes/functions.php',
              "    $converted = 0;\n    $scanned = 0;\n    $lastId = $cursor;",
              "    $converted = 0;\n    $scanned = 0;\n    $memorySkipped = 0;\n    $oversizeSkipped = 0;\n    $lastId = $cursor;",
              'add optimizer skip counters'
          )
          replace_once(
              'public_html/includes/functions.php',
              "        $width = (int) $info[0];\n        $height = (int) $info[1];\n        $extension = strtolower((string) pathinfo($source, PATHINFO_EXTENSION));",
              "        $width = (int) $info[0];\n        $height = (int) $info[1];\n        if ($size < 1 || $size > 8 * 1024 * 1024\n            || $width < 1 || $height < 1 || $width > 6000 || $height > 6000\n            || $width * $height > 24000000) {\n            $oversizeSkipped++;\n            continue;\n        }\n        $extension = strtolower((string) pathinfo($source, PATHINFO_EXTENSION));",
              'skip unsupported legacy image sizes before reading bytes'
          )
          replace_once(
              'public_html/includes/functions.php',
              "        if ($width <= 1024 && $height <= 1024 && $size > 0 && $size <= 260 * 1024) continue;\n        $bytes = @file_get_contents($source);",
              "        if ($width <= 1024 && $height <= 1024 && $size > 0 && $size <= 260 * 1024) continue;\n        if (function_exists('sakazukiProductImageOptimizationMemoryPlan')) {\n            $memoryPlan = sakazukiProductImageOptimizationMemoryPlan($width, $height, max(0, $size), 1024);\n            if (empty($memoryPlan['safe'])) {\n                $memorySkipped++;\n                continue;\n            }\n        }\n        $bytes = @file_get_contents($source);",
              'preflight memory before loading legacy image bytes'
          )
          replace_once(
              'public_html/includes/functions.php',
              "        $optimized = sakazukiWriteOptimizedProductImage($bytes, $uploadDir, 'opt_', 1024);\n        if (empty($optimized['success']) || empty($optimized['filename'])) continue;",
              "        $optimized = sakazukiWriteOptimizedProductImage($bytes, $uploadDir, 'opt_', 1024);\n        unset($bytes);\n        if (empty($optimized['success']) || empty($optimized['filename'])) {\n            if (($optimized['reason'] ?? '') === 'memory_budget') $memorySkipped++;\n            continue;\n        }",
              'release compressed bytes immediately after optimization'
          )
          replace_once(
              'public_html/includes/functions.php',
              "        $converted++;\n        if ($converted >= $maxConverted) break;",
              "        $converted++;\n        if (function_exists('gc_collect_cycles')) gc_collect_cycles();\n        if ($converted >= $maxConverted) break;",
              'collect cycles between optimizer items'
          )
          replace_once(
              'public_html/includes/functions.php',
              "    return [\n        'success' => true,\n        'scanned' => $scanned,\n        'converted' => $converted,\n        'completed_pass' => $reachedEnd,\n        'next_interval_seconds' => $reachedEnd ? 21600 : ($converted > 0 ? 60 : 600),\n    ];",
              "    $message = $memorySkipped > 0\n        ? ($converted > 0 ? 'Legacy product images optimized; memory-risk images skipped safely' : 'Memory-risk legacy product images skipped safely')\n        : ($converted > 0 ? 'Legacy product images optimized' : 'No legacy product images required optimization');\n    return [\n        'success' => true,\n        'message' => $message,\n        'scanned' => $scanned,\n        'converted' => $converted,\n        'memory_skipped' => $memorySkipped,\n        'oversize_skipped' => $oversizeSkipped,\n        'memory_limit_bytes' => function_exists('sakazukiPhpMemoryLimitBytes') ? sakazukiPhpMemoryLimitBytes() : 0,\n        'memory_peak_bytes' => max(0, (int) memory_get_peak_usage(true)),\n        'completed_pass' => $reachedEnd,\n        'next_interval_seconds' => $reachedEnd ? 21600 : ($converted > 0 ? 300 : 900),\n    ];",
              'return optimizer memory diagnostics'
          )

          replace_once(
              'public_html/includes/automation.php',
              "        'product_image_optimizer' => [\n            'critical' => false,\n            // Convert only a few legacy images per run so shared hosting never\n            // gets a CPU/memory spike from rebuilding the entire catalogue.\n            'interval' => 60,\n            'callback' => static function (): array {\n                return function_exists('sakazukiOptimizeLegacyProductImages')\n                    ? sakazukiOptimizeLegacyProductImages(3)\n                    : ['success' => true, 'skipped' => true, 'message' => 'Image optimizer is unavailable'];\n            },\n        ],",
              "        'product_image_optimizer' => [\n            'critical' => false,\n            // Decode at most one legacy image per run. The optimizer performs a\n            // conservative memory preflight before file_get_contents()/GD so a\n            // large source image cannot take down the whole maintenance request.\n            'interval' => 300,\n            'callback' => static function (): array {\n                return function_exists('sakazukiOptimizeLegacyProductImages')\n                    ? sakazukiOptimizeLegacyProductImages(1)\n                    : ['success' => true, 'skipped' => true, 'message' => 'Image optimizer is unavailable'];\n            },\n        ],",
              'throttle product image optimizer'
          )

          replace_once(
              'public_html/automation_runner.php',
              "        foreach (['attempted','processed','succeeded','updated','published','reconciled','failed','deleted','skipped','scanned','converted'] as $key) {",
              "        foreach (['attempted','processed','succeeded','updated','published','reconciled','failed','deleted','skipped','scanned','converted','memory_skipped','oversize_skipped','freed_bytes','completed_pass','next_interval_seconds','memory_limit_bytes','memory_peak_bytes'] as $key) {",
              'expose maintenance image diagnostics'
          )

          old_shutdown = r'''    $GLOBALS['sakazuki_direct_finished'] = false;
              $GLOBALS['sakazuki_direct_stage'] = 'startup';
              register_shutdown_function(static function (): void {
                  if (!empty($GLOBALS['sakazuki_direct_finished'])) return;
                  $last = error_get_last();
                  if (!is_array($last)) return;
                  $fatalTypes = [E_ERROR, E_PARSE, E_CORE_ERROR, E_COMPILE_ERROR, E_USER_ERROR];
                  if (!in_array((int) ($last['type'] ?? 0), $fatalTypes, true)) return;
                  $allowedStages = [
                      'startup','schema','pending_orders','slip_reconciliation','cgo_inventory','supplier_catalog',
                      'cgo_catalog','shared_history','shared_binance_history','commerce_center','history_cleanup','product_image_cleanup','product_image_optimizer','admin_transaction_indexes',
                      'history_schema','commerce_schema','checkout_health','binance_clock','maintenance_diagnostics','unknown_job'
                  ];
                  $stage = (string) ($GLOBALS['sakazuki_direct_stage'] ?? 'unknown_job');
                  if (!in_array($stage, $allowedStages, true)) $stage = 'unknown_job';
                  if (!headers_sent()) header('Content-Type: application/json; charset=utf-8');
                  http_response_code(500);
                  echo automationDirectJson([
                      'success' => false,
                      'health' => 'failed',
                      'code' => 'runner_fatal',
                      'stage' => $stage,
                      'reason' => automationDirectFatalReason($last),
                  ]);
              });'''
          new_shutdown = r'''    $GLOBALS['sakazuki_direct_finished'] = false;
              $GLOBALS['sakazuki_direct_stage'] = 'startup';
              $GLOBALS['sakazuki_direct_partial_jobs'] = [];
              $GLOBALS['sakazuki_direct_partial_warnings'] = [];
              $GLOBALS['sakazuki_direct_run_id'] = '';
              $GLOBALS['sakazuki_direct_started_float'] = microtime(true);
              // Keep a small block available so an OOM shutdown can free it before
              // encoding a useful diagnostic response instead of dying twice.
              $GLOBALS['sakazuki_direct_emergency_reserve'] = str_repeat('R', 262144);
              register_shutdown_function(static function () use ($mode): void {
                  if (!empty($GLOBALS['sakazuki_direct_finished'])) return;
                  $last = error_get_last();
                  if (!is_array($last)) return;
                  $fatalTypes = [E_ERROR, E_PARSE, E_CORE_ERROR, E_COMPILE_ERROR, E_USER_ERROR];
                  if (!in_array((int) ($last['type'] ?? 0), $fatalTypes, true)) return;
                  unset($GLOBALS['sakazuki_direct_emergency_reserve']);
                  $allowedStages = [
                      'startup','schema','pending_orders','slip_reconciliation','cgo_inventory','supplier_catalog',
                      'cgo_catalog','shared_history','shared_binance_history','commerce_center','history_cleanup','product_image_cleanup','product_image_optimizer','admin_transaction_indexes',
                      'history_schema','commerce_schema','checkout_health','binance_clock','maintenance_diagnostics','unknown_job'
                  ];
                  $stage = (string) ($GLOBALS['sakazuki_direct_stage'] ?? 'unknown_job');
                  if (!in_array($stage, $allowedStages, true)) $stage = 'unknown_job';
                  $started = (float) ($GLOBALS['sakazuki_direct_started_float'] ?? microtime(true));
                  $payload = [
                      'success' => false,
                      'health' => 'failed',
                      'code' => 'runner_fatal',
                      'stage' => $stage,
                      'reason' => automationDirectFatalReason($last),
                      'runner' => 'single_site_' . $mode,
                      'duration_ms' => max(0, (int) round((microtime(true) - $started) * 1000)),
                      'warnings' => array_values((array) ($GLOBALS['sakazuki_direct_partial_warnings'] ?? [])),
                      'jobs' => (array) ($GLOBALS['sakazuki_direct_partial_jobs'] ?? []),
                      'runtime' => [
                          'memory_limit_bytes' => function_exists('sakazukiPhpMemoryLimitBytes') ? sakazukiPhpMemoryLimitBytes() : 0,
                          'memory_usage_bytes' => max(0, (int) memory_get_usage(true)),
                          'memory_peak_bytes' => max(0, (int) memory_get_peak_usage(true)),
                      ],
                  ];
                  $runId = trim((string) ($GLOBALS['sakazuki_direct_run_id'] ?? ''));
                  if ($runId !== '') $payload['run_id'] = $runId;
                  if (!headers_sent()) header('Content-Type: application/json; charset=utf-8');
                  http_response_code(500);
                  echo automationDirectJson($payload);
              });'''
          replace_once('public_html/automation_runner.php', old_shutdown, new_shutdown, 'upgrade fatal diagnostic response')

          replace_once(
              'public_html/automation_runner.php',
              "    error_log('[maintenance][run] id=' . $maintenanceRunId . '; event=start; db=' . $dbFingerprint\n        . '; auth=maintenance_hmac_sha256_v2');",
              "    if (!$isCli) $GLOBALS['sakazuki_direct_run_id'] = $maintenanceRunId;\n    error_log('[maintenance][run] id=' . $maintenanceRunId . '; event=start; db=' . $dbFingerprint\n        . '; auth=maintenance_hmac_sha256_v2');",
              'publish maintenance run id to fatal handler'
          )
          replace_once(
              'public_html/automation_runner.php',
              "if ($schemaReady) {\n    foreach ($allowedJobs as $jobName) {",
              "if (!$isCli) $GLOBALS['sakazuki_direct_partial_warnings'] = $warnings;\n\nif ($schemaReady) {\n    foreach ($allowedJobs as $jobName) {",
              'initialize partial warning snapshot'
          )
          replace_once(
              'public_html/automation_runner.php',
              "        if (($result['success'] ?? true) === false) {\n            if ($critical) $criticalFailures[] = $jobName;\n            else $warnings[] = $jobName;\n        }",
              "        if (($result['success'] ?? true) === false) {\n            if ($critical) $criticalFailures[] = $jobName;\n            else $warnings[] = $jobName;\n        }\n        if (!$isCli) {\n            $GLOBALS['sakazuki_direct_partial_jobs'] = $results;\n            $GLOBALS['sakazuki_direct_partial_warnings'] = array_values(array_unique($warnings));\n        }",
              'snapshot completed jobs for fatal diagnostics'
          )
          replace_once(
              'public_html/automation_runner.php',
              "if ($mode === 'maintenance') {\n    $payload['run_id'] = $maintenanceRunId;",
              "if ($mode === 'maintenance') {\n    $payload['runtime'] = [\n        'memory_limit_bytes' => function_exists('sakazukiPhpMemoryLimitBytes') ? sakazukiPhpMemoryLimitBytes() : 0,\n        'memory_usage_bytes' => max(0, (int) memory_get_usage(true)),\n        'memory_peak_bytes' => max(0, (int) memory_get_peak_usage(true)),\n    ];\n    $payload['run_id'] = $maintenanceRunId;",
              'add runtime memory diagnostics to normal maintenance JSON'
          )
          replace_once(
              'public_html/automation_runner.php',
              "$payload['maintenance_version'] = '2.2.0';",
              "$payload['maintenance_version'] = '2.3.0';",
              'bump maintenance response version'
          )

          test_path = Path('tests/product_image_lifecycle_test.php')
          test_source = test_path.read_text()
          insert_before = "$root = sys_get_temp_dir() . '/sakazuki-image-lifecycle-' . bin2hex(random_bytes(6));"
          if test_source.count(insert_before) != 1:
              raise SystemExit('test memory insertion target missing')
          memory_tests = r'''image_lifecycle_assert(
              sakazukiParsePhpIniBytes('128M') === 128 * 1024 * 1024,
              'PHP memory limit parser should understand M suffix'
          );
          image_lifecycle_assert(
              sakazukiParsePhpIniBytes('-1') === 0,
              'unlimited PHP memory limit should normalize to zero'
          );
          $smallMemoryPlan = sakazukiProductImageOptimizationMemoryPlan(
              1600,
              900,
              1024 * 1024,
              1024,
              128 * 1024 * 1024,
              8 * 1024 * 1024
          );
          image_lifecycle_assert(!empty($smallMemoryPlan['safe']), 'normal storefront image should fit a 128M worker budget');
          $largeMemoryPlan = sakazukiProductImageOptimizationMemoryPlan(
              6000,
              4000,
              4 * 1024 * 1024,
              1024,
              128 * 1024 * 1024,
              8 * 1024 * 1024
          );
          image_lifecycle_assert(empty($largeMemoryPlan['safe']), '24MP image must be rejected before GD decode on a 128M worker');
          image_lifecycle_assert(
              ($largeMemoryPlan['estimated_additional_bytes'] ?? 0) > ($largeMemoryPlan['available_bytes'] ?? 0),
              'unsafe memory plan should explain that estimated demand exceeds available budget'
          );

          '''
          test_source = test_source.replace(insert_before, memory_tests + insert_before, 1)

          old_runner_assertions = r'''image_lifecycle_assert(
              is_string($automationRunner)
                  && strpos($automationRunner, "'product_image_cleanup','product_image_optimizer','admin_transaction_indexes'") !== false,
              'maintenance runner fatal-stage allowlist must include product image jobs'
          );
          '''
          new_runner_assertions = old_runner_assertions + r'''
          image_lifecycle_assert(
              is_string($automationRunner)
                  && strpos($automationRunner, "'memory_limit_bytes' => function_exists('sakazukiPhpMemoryLimitBytes')") !== false
                  && strpos($automationRunner, "'jobs' => (array) ($GLOBALS['sakazuki_direct_partial_jobs'] ?? [])") !== false,
              'runner fatal diagnostics should preserve partial jobs and memory information'
          );

          $functionsSource = file_get_contents(__DIR__ . '/../public_html/includes/functions.php');
          $preflightNeedle = "$memoryPlan = sakazukiProductImageOptimizationMemoryPlan($width, $height, max(0, $size), 1024);";
          $readNeedle = '$bytes = @file_get_contents($source);';
          $preflightPos = is_string($functionsSource) ? strpos($functionsSource, $preflightNeedle) : false;
          $readPos = is_string($functionsSource) ? strpos($functionsSource, $readNeedle) : false;
          image_lifecycle_assert(
              $preflightPos !== false && $readPos !== false && $preflightPos < $readPos,
              'legacy optimizer must perform memory preflight before reading compressed image bytes'
          );

          $automationSource = file_get_contents(__DIR__ . '/../public_html/includes/automation.php');
          image_lifecycle_assert(
              is_string($automationSource)
                  && strpos($automationSource, "'interval' => 300") !== false
                  && strpos($automationSource, 'sakazukiOptimizeLegacyProductImages(1)') !== false,
              'automation should process at most one legacy image per optimizer run'
          );
          '''
          if test_source.count(old_runner_assertions) != 1:
              raise SystemExit('test runner assertion target missing')
          test_source = test_source.replace(old_runner_assertions, new_runner_assertions, 1)
          test_path.write_text(test_source)
          PY

      - name: Verify syntax and regressions
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          php tests/product_image_lifecycle_test.php
          failures=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! php -l "$file" >/tmp/php-lint.out 2>&1; then
              cat /tmp/php-lint.out
              failures=$((failures + 1))
            fi
          done < <(find public_html -type f -name '*.php' -print0)
          echo "PHP files checked: $count"
          test "$failures" -eq 0
          for test_file in tests/*.php; do php "$test_file"; done

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public_html/includes/product_image_lifecycle.php public_html/includes/functions.php public_html/includes/automation.php public_html/automation_runner.php tests/product_image_lifecycle_test.php
          git commit -m "Make product image optimizer memory safe"
          git push origin HEAD:fix/product-image-optimizer-memory-20260924
