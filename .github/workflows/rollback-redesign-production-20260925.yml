name: Rollback Redesign Production

on:
  push:
    branches:
      - main
    paths:
      - .github/deploy-requests/rollback-redesign-20260925.approved

permissions:
  contents: read

concurrency:
  group: rollback-redesign-production
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
      BASELINE_SHA: 34b9f2f7a5ae2923fe07bc7a931f5589ceec1a65
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate rollback scope and fetch baseline
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          git fetch --no-tags --depth=1 origin "$BASELINE_SHA"
          git cat-file -e "$BASELINE_SHA:public_html/app.php"
          git cat-file -e "$BASELINE_SHA:public_html/assets/js/nav.js"
          git show "$BASELINE_SHA:public_html/assets/js/nav.js" > /tmp/baseline-nav.js
          echo "Rollback scope: restore baseline nav.js and remove three redesign-only assets."

      - name: Resolve production root safely
        shell: bash
        run: |
          set -euo pipefail
          host="${FTP_HOST#ftp://}"
          host="${host#ftps://}"
          host="${host%/}"
          remote="${FTP_REMOTE_DIR#/}"
          remote="${remote%/}"
          git show "$BASELINE_SHA:public_html/app.php" > /tmp/baseline-app.php

          test_candidate() {
            label="$1"
            base="$2"
            tmp="$(mktemp)"
            if curl --silent --show-error --fail --globoff \
              --connect-timeout 15 --max-time 45 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --output "$tmp" "${base}/app.php" 2>/dev/null; then
              if cmp -s /tmp/baseline-app.php "$tmp"; then
                rm -f "$tmp"
                echo "FTP_BASE_URL=$base" >> "$GITHUB_ENV"
                echo "Production root resolved safely: $label"
                return 0
              fi
            fi
            rm -f "$tmp"
            return 1
          }

          if [ -n "$remote" ] && test_candidate "configured login-relative path" "ftp://$host/$remote"; then exit 0; fi
          if [ -n "$remote" ] && test_candidate "configured absolute path" "ftp://$host//$remote"; then exit 0; fi
          if test_candidate "FTP account root" "ftp://$host"; then exit 0; fi
          if test_candidate "public_html below FTP account root" "ftp://$host/public_html"; then exit 0; fi
          echo "Could not identify production root safely. Nothing changed."
          exit 2

      - name: Backup current redesign production files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-before-redesign-rollback/assets/js production-before-redesign-rollback/assets/css
          for rel in assets/js/nav.js assets/js/store-v2.js assets/css/store-v2.css assets/css/sakazuki-ui.css; do
            target="production-before-redesign-rollback/$rel"
            mkdir -p "$(dirname "$target")"
            if curl --silent --show-error --fail --globoff \
              --connect-timeout 15 --max-time 45 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --output "$target" "${FTP_BASE_URL}/${rel}" 2>/dev/null; then
              sha256sum "$target" >> production-before-redesign-rollback/SHA256SUMS.txt
              echo "$rel: backed up"
            else
              rm -f "$target"
              echo "$rel: missing/unreadable" >> production-before-redesign-rollback/MISSING.txt
            fi
          done

      - name: Store rollback backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-before-redesign-rollback-${{ github.run_id }}
          path: production-before-redesign-rollback
          if-no-files-found: error
          retention-days: 30

      - name: Restore original nav.js
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --globoff \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file /tmp/baseline-nav.js \
            "${FTP_BASE_URL}/assets/js/nav.js" >/dev/null
          echo "assets/js/nav.js restored from baseline $BASELINE_SHA"

      - name: Remove redesign-only production assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib, os
          from urllib.parse import urlparse

          base = os.environ['FTP_BASE_URL']
          user = os.environ['FTP_USERNAME']
          password = os.environ['FTP_PASSWORD']
          parsed = urlparse(base)
          ftp = ftplib.FTP(parsed.hostname, timeout=30)
          ftp.login(user, password)
          root = parsed.path or '/'
          ftp.cwd(root)
          targets = [
              'assets/css/sakazuki-ui.css',
              'assets/js/store-v2.js',
              'assets/css/store-v2.css',
          ]
          for rel in targets:
              try:
                  ftp.delete(rel)
                  print(f'{rel}: deleted')
              except ftplib.error_perm as exc:
                  if str(exc).startswith('550'):
                      print(f'{rel}: already missing')
                  else:
                      raise
          ftp.quit()
          PY

      - name: Verify production matches pre-redesign state for touched assets
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          curl --silent --show-error --fail --globoff \
            --connect-timeout 15 --max-time 45 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --output "$tmp" "${FTP_BASE_URL}/assets/js/nav.js"
          cmp -s /tmp/baseline-nav.js "$tmp"
          rm -f "$tmp"
          echo "assets/js/nav.js: BASELINE MATCH"

          for rel in assets/css/sakazuki-ui.css assets/js/store-v2.js assets/css/store-v2.css; do
            tmp="$(mktemp)"
            if curl --silent --show-error --fail --globoff \
              --connect-timeout 10 --max-time 30 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --output "$tmp" "${FTP_BASE_URL}/${rel}" 2>/dev/null; then
              echo "Rollback verification failed: $rel still exists"
              rm -f "$tmp"
              exit 1
            fi
            rm -f "$tmp"
            echo "$rel: ABSENT"
          done

      - name: Public smoke check
        shell: bash
        run: |
          set -euo pipefail
          base="https://sakazuki.spwz.online"
          code="$(curl --silent --show-error --location --connect-timeout 15 --max-time 45 --output /dev/null --write-out '%{http_code}' "${base}/assets/js/nav.js?rollback=${GITHUB_SHA}")"
          echo "assets/js/nav.js: HTTP $code"
          [ "$code" = "200" ]

      - name: Rollback summary
        shell: bash
        run: |
          {
            echo "## Redesign production rollback"
            echo
            echo "Restored assets/js/nav.js from baseline $BASELINE_SHA."
            echo "Removed redesign-only assets: sakazuki-ui.css, store-v2.js, store-v2.css."
            echo "Pre-rollback production files were backed up as an Actions artifact."
          } >> "$GITHUB_STEP_SUMMARY"
