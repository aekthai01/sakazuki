name: FTP Pre-Deploy Backup

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ftp-predeploy-backup.yml"

permissions:
  contents: read

jobs:
  backup-ftp:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FTP_HOST: svth01.inwcloud.shop
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: public_html

    steps:
      - name: Validate FTP configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD FTP_REMOTE_DIR; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required FTP setting: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "FTP configuration is present."

      - name: Install lftp
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Download deploy-managed files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup/site

          cat > /tmp/lftp-backup.conf <<'EOF'
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 30
          set ftp:passive-mode true
          set ssl:verify-certificate true
          EOF

          lftp -f /tmp/lftp-backup.conf -c "open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" ftp://$FTP_HOST; cd \"$FTP_REMOTE_DIR\"; mirror --parallel=4 --exclude-glob \"assets/uploads/**\" --exclude-glob \"includes/exchange_rate_cache.json\" --exclude-glob \".env\" --exclude-glob \"*.env\" . backup/site"

          mkdir -p backup/site/assets/uploads/icons backup/site/assets/uploads/products
          lftp -f /tmp/lftp-backup.conf -c "open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" ftp://$FTP_HOST; cd \"$FTP_REMOTE_DIR\"; get \"assets/uploads/.htaccess\" -o \"backup/site/assets/uploads/.htaccess\"; get \"assets/uploads/icons/.htaccess\" -o \"backup/site/assets/uploads/icons/.htaccess\"; get \"assets/uploads/icons/index.php\" -o \"backup/site/assets/uploads/icons/index.php\"; get \"assets/uploads/products/.htaccess\" -o \"backup/site/assets/uploads/products/.htaccess\"; get \"assets/uploads/products/index.php\" -o \"backup/site/assets/uploads/products/index.php\""

          test -f backup/site/includes/db.php
          test -f backup/site/assets/uploads/.htaccess
          test -f backup/site/assets/uploads/icons/.htaccess
          test -f backup/site/assets/uploads/icons/index.php
          test -f backup/site/assets/uploads/products/.htaccess
          test -f backup/site/assets/uploads/products/index.php
          test ! -e backup/site/.env
          test ! -e backup/site/includes/exchange_rate_cache.json

          while IFS= read -r file; do
            case "$file" in
              backup/site/assets/uploads/.htaccess|\
              backup/site/assets/uploads/icons/.htaccess|\
              backup/site/assets/uploads/icons/index.php|\
              backup/site/assets/uploads/products/.htaccess|\
              backup/site/assets/uploads/products/index.php)
                ;;
              *)
                echo "Runtime upload unexpectedly entered backup: $file"
                exit 1
                ;;
            esac
          done < <(find backup/site/assets/uploads -type f -print)

          file_count=$(find backup/site -type f | wc -l | tr -d ' ')
          dir_count=$(find backup/site -type d | wc -l | tr -d ' ')
          total_bytes=$(du -sb backup/site | awk '{print $1}')

          printf 'FTP host: %s\nRemote directory: %s\nGenerated (UTC): %s\nFiles: %s\nDirectories: %s\nBytes: %s\n' \
            "$FTP_HOST" "$FTP_REMOTE_DIR" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "$file_count" "$dir_count" "$total_bytes" > backup/summary.txt

          printf '%s\n' \
            'Included application config loader:' \
            '- includes/db.php (loads private config/environment; no production credential embedded)' \
            'Included upload-directory guard files only:' \
            '- assets/uploads/.htaccess' \
            '- assets/uploads/icons/.htaccess' \
            '- assets/uploads/icons/index.php' \
            '- assets/uploads/products/.htaccess' \
            '- assets/uploads/products/index.php' \
            'Excluded from backup:' \
            '- all other assets/uploads/** runtime/user-generated files' \
            '- includes/exchange_rate_cache.json (runtime cache)' \
            '- .env and *.env (environment secrets)' \
            >> backup/summary.txt

          echo "Backup source downloaded successfully."
          cat backup/summary.txt

      - name: Build and verify archive
        shell: bash
        run: |
          set -euo pipefail

          (
            cd backup/site
            find . -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > backup/sha256sums.txt

          tar -C backup/site -czf backup/public_html-predeploy.tar.gz .

          if tar -tzf backup/public_html-predeploy.tar.gz \
            | grep -Eq '(^|/)[^/]*\.env$|(^|/)includes/exchange_rate_cache\.json$'; then
            echo "Sensitive or runtime-only file was found in the backup archive."
            exit 1
          fi

          (
            cd backup
            sha256sum public_html-predeploy.tar.gz > archive.sha256
            sha256sum -c archive.sha256
          )

          rm -rf /tmp/ftp-backup-verify
          mkdir -p /tmp/ftp-backup-verify
          tar -xzf backup/public_html-predeploy.tar.gz -C /tmp/ftp-backup-verify
          (
            cd /tmp/ftp-backup-verify
            sha256sum -c "$GITHUB_WORKSPACE/backup/sha256sums.txt" >/dev/null
          )

          test -f /tmp/ftp-backup-verify/includes/db.php
          test -f /tmp/ftp-backup-verify/assets/uploads/.htaccess
          test -f /tmp/ftp-backup-verify/assets/uploads/icons/.htaccess
          test -f /tmp/ftp-backup-verify/assets/uploads/icons/index.php
          test -f /tmp/ftp-backup-verify/assets/uploads/products/.htaccess
          test -f /tmp/ftp-backup-verify/assets/uploads/products/index.php

          echo "Archive and portable checksums verified successfully."
          cat backup/archive.sha256

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ftp-predeploy-backup-${{ github.run_id }}
          path: |
            backup/public_html-predeploy.tar.gz
            backup/archive.sha256
            backup/sha256sums.txt
            backup/summary.txt
          if-no-files-found: error
          retention-days: 14
