name: SlipVerify Nearby CI

on:
  push:
    branches:
      - fix/slipverify-use-store-receiver-20260924
  pull_request:
    paths:
      - "public_html/includes/slip_nearby.php"
      - "public_html/admin/slipverify.php"
      - "tests/slip_nearby_test.php"
      - ".github/workflows/slip-nearby-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, mysqli, fileinfo
          coverage: none

      - name: Lint SlipVerify probe files
        shell: bash
        run: |
          set -euo pipefail
          php -l public_html/includes/slip_nearby.php
          php -l public_html/admin/slipverify.php
          php -l tests/slip_nearby_test.php

      - name: Guard single receiver source of truth
        shell: bash
        run: |
          set -euo pipefail
          file="public_html/admin/slipverify.php"
          grep -q "getSetting('easyslip_receiver_name'" "$file"
          grep -q "getSetting('easyslip_account_number'" "$file"
          grep -q "getSetting('easyslip_bank_name'" "$file"
          if grep -Eq "slipverify_nearby_(receiver_name|bank_code|account_no)" "$file"; then
            echo "SlipVerify admin must not create a second receiver settings source."
            exit 1
          fi

      - name: Run SlipVerify API-key contract tests
        shell: bash
        run: |
          set -euo pipefail
          php tests/slip_nearby_test.php
