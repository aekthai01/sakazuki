name: Bootstrap BLACKUP V3 source

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/READY'

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import reviewed source snapshot
        run: python tools/bootstrap_import.py

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import sanitized BLACKUP V3 source snapshot"
          git push
