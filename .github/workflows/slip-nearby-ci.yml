name: Bank Slip Provider CI

# GitHub Actions minutes are exhausted for the current billing cycle.
# Keep this workflow manual-only until the owner re-enables automatic CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, mysqli, fileinfo
          coverage: none

      - name: Lint bank-slip provider files
        shell: bash
        run: |
          set -euo pipefail
          php -l public_html/includes/functions.php
          php -l public_html/includes/slip_nearby.php
          php -l public_html/admin/settings.php
          php -l tests/slip_nearby_test.php

      - name: Guard one receiver source of truth
        shell: bash
        run: |
          set -euo pipefail
          file="public_html/admin/settings.php"
          grep -q "easyslip_receiver_name" "$file"
          grep -q "easyslip_account_number" "$file"
          if grep -Eq "slipverify_nearby_(receiver_name|bank_code|account_no)" "$file"; then
            echo "Nearby must reuse the existing store receiver settings."
            exit 1
          fi
          test ! -e public_html/admin/slipverify.php

      - name: Run Nearby provider contract tests
        shell: bash
        run: |
          set -euo pipefail
          php tests/slip_nearby_test.php
