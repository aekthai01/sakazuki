name: TrueMoney ByteInDev CI

on:
  push:
    branches:
      - upgrade/truemoney-byteindev-20260920
      - fix/truemoney-disable-go-20260920
      - feature/truemoney-recipient-guard-20260920
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, mysqli
          coverage: none

      - name: Lint TrueMoney files
        shell: bash
        run: |
          set -euo pipefail
          php -l public_html/includes/truemoney_byteindev.php
          php -l public_html/includes/truemoney_byteindev_route.php
          php -l public_html/user/redeem_angpao.php
          php -l tests/truemoney_byteindev_test.php
          php -l tests/truemoney_byteindev_routing_test.php

      - name: Run ByteInDev regression tests
        shell: bash
        run: |
          set -euo pipefail
          php tests/truemoney_byteindev_test.php
          php tests/truemoney_byteindev_routing_test.php

      - name: Lint all production PHP
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! php -l "$file" >/tmp/php-lint.out 2>&1; then
              cat /tmp/php-lint.out
              failures=$((failures + 1))
            fi
          done < <(find public_html -type f -name '*.php' -print0)
          echo "PHP files checked: $count"
          if [ "$failures" -ne 0 ]; then
            echo "PHP syntax failures: $failures"
            exit 1
          fi
