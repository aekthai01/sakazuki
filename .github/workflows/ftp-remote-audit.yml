name: FTP Remote Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ftp-remote-audit.yml"

permissions:
  contents: read

jobs:
  audit-ftp:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FTP_HOST: svth01.inwcloud.shop
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: public_html

    steps:
      - name: Validate FTP configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD FTP_REMOTE_DIR; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required FTP setting: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "FTP configuration is present."

      - name: Install lftp
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Build remote inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit

          cat > /tmp/lftp-audit.conf <<'EOF'
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 20
          set ftp:passive-mode true
          set ssl:verify-certificate true
          EOF

          lftp -f /tmp/lftp-audit.conf -c "open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" ftp://$FTP_HOST; cd \"$FTP_REMOTE_DIR\"; pwd; find ." \
            > audit/remote-inventory.txt

          sed -i 's#^./##' audit/remote-inventory.txt
          sed -i '/^$/d' audit/remote-inventory.txt

          printf 'FTP host: %s\nRemote directory: %s\nGenerated (UTC): %s\n' \
            "$FTP_HOST" "$FTP_REMOTE_DIR" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > audit/summary.txt

          total=$(wc -l < audit/remote-inventory.txt | tr -d ' ')
          printf 'Inventory entries: %s\n' "$total" >> audit/summary.txt

          echo "Remote inventory created successfully."
          echo "Inventory entries: $total"
          echo "Top-level entries:"
          awk -F/ 'NF == 1 {print}' audit/remote-inventory.txt | head -100

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: ftp-remote-audit
          path: audit/
          if-no-files-found: error
          retention-days: 7
