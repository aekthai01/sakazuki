name: Audit SAK010 Exact Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-sak010.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Compare exact Git blob SHAs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,zlib
          data=''.encode()
          open('/tmp/manifest.tsv','wb').write(zlib.decompress(base64.b64decode(data)))
          PY
          ok=0; missing=0; mismatch=0
          while IFS=$'\t' read -r expected path; do
            [ -n "$expected" ] || continue
            if [ ! -f "$path" ]; then
              echo "MISSING $path expected=$expected"
              missing=$((missing+1))
              continue
            fi
            actual="$(git hash-object "$path")"
            if [ "$actual" = "$expected" ]; then
              ok=$((ok+1))
            else
              echo "MISMATCH $path expected=$expected actual=$actual"
              mismatch=$((mismatch+1))
            fi
          done < /tmp/manifest.tsv
          echo "SUMMARY ok=$ok missing=$missing mismatch=$mismatch total=$((ok+missing+mismatch))"
          if [ "$missing" -ne 0 ] || [ "$mismatch" -ne 0 ]; then exit 2; fi
