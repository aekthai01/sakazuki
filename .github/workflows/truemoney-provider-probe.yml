name: TrueMoney Provider Probe

on:
  push:
    branches:
      - upgrade/truemoney-dokmai-20260919
    paths:
      - '.github/workflows/truemoney-provider-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe direct TrueMoney redeem with fake voucher
        shell: bash
        run: |
          set -euo pipefail
          hash='ZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ'
          body='{"mobile":"0000000000","voucher_hash":"'"$hash"'"}'
          code=$(curl --silent --show-error --output /tmp/tmn-body --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 20 \
            --request POST \
            --header 'accept: application/json' \
            --header 'content-type: application/json' \
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36' \
            --data "$body" \
            "https://gift.truemoney.com/campaign/vouchers/$hash/redeem" || true)
          bytes=$(wc -c </tmp/tmn-body 2>/dev/null || printf 0)
          ctype=$(file -b --mime-type /tmp/tmn-body 2>/dev/null || true)
          echo "direct_http=$code body_bytes=$bytes mime=$ctype"
          if [ "$code" = '000' ]; then
            echo 'Direct TrueMoney redeem route was unreachable.'
            exit 2
          fi
          if [ "$code" = '403' ]; then
            echo 'Direct TrueMoney redeem route is blocked from this server environment.'
            exit 3
          fi
          echo 'Direct TrueMoney redeem route returned a non-block response.'

      - name: Probe Dokmai gateway without credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          body='{"phoneNumber":"0000000000","voucher":"https://gift.truemoney.com/campaign/?v=ZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ"}'
          code=$(curl --silent --show-error --output /tmp/dokmai-body --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 20 \
            --request POST \
            --header 'accept: application/json' \
            --header 'content-type: application/json' \
            --header 'Idempotency-Key: sakazuki-probe-no-value' \
            --data "$body" \
            'https://api.dokmaistore.com/api/v1/payments/core/angpao/redeem' || true)
          bytes=$(wc -c </tmp/dokmai-body 2>/dev/null || printf 0)
          echo "dokmai_http=$code body_bytes=$bytes"
          if [ "$code" = '000' ]; then
            echo 'Dokmai gateway was unreachable.'
            exit 2
          fi
          if [ "$code" -ge 500 ] 2>/dev/null; then
            echo 'Dokmai gateway returned a 5xx response.'
            exit 3
          fi
          echo 'Dokmai gateway is reachable; an auth/validation error is expected without an API key.'
