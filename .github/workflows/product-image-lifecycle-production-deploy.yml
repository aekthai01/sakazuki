name: Product Image Lifecycle Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/product-image-lifecycle-production-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-backup-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
      PRE_DEPLOY_MAIN: 29ed9553382c5fd19dd9388e9402325486c13e8a

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, mysqli
          coverage: none

      - name: Validate deploy inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD FTP_REMOTE_DIR; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done
          test -f public_html/admin/products.php
          test -f public_html/includes/functions.php
          test -f public_html/includes/automation.php
          test -f public_html/includes/product_image_lifecycle.php
          test -f tests/product_image_lifecycle_test.php

      - name: Re-run product image verification
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$PRE_DEPLOY_MAIN"..HEAD -- . ':!.github/workflows/product-image-lifecycle-production-deploy.yml'
          php tests/product_image_lifecycle_test.php
          failures=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! php -l "$file" >/tmp/php-lint.out 2>&1; then
              cat /tmp/php-lint.out
              failures=$((failures + 1))
            fi
          done < <(find public_html -type f -name '*.php' -print0)
          echo "PHP files checked: $count"
          test "$failures" -eq 0

      - name: Backup production and enforce source-of-truth preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup/admin backup/includes base/admin base/includes deploy-result
          remote_dir="${FTP_REMOTE_DIR#/}"
          remote_dir="${remote_dir%/}"
          base_url="ftp://${FTP_HOST}/${remote_dir}"

          for path in admin/products.php includes/functions.php includes/automation.php; do
            mkdir -p "backup/$(dirname "$path")" "base/$(dirname "$path")"
            curl --silent --show-error --fail --connect-timeout 15 --max-time 90 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              "${base_url}/${path}" --output "backup/${path}"
            git show "${PRE_DEPLOY_MAIN}:public_html/${path}" > "base/${path}"
            if ! cmp -s "backup/${path}" "base/${path}"; then
              echo "Production drift detected before deploy: ${path}"
              echo "Refusing to overwrite a host file that differs from pre-deploy main."
              exit 1
            fi
          done

          if curl --silent --show-error --fail --connect-timeout 15 --max-time 90 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "${base_url}/includes/product_image_lifecycle.php" \
            --output backup/includes/product_image_lifecycle.php; then
            if ! cmp -s backup/includes/product_image_lifecycle.php public_html/includes/product_image_lifecycle.php; then
              echo "Unexpected existing product_image_lifecycle.php differs from deploy source"
              exit 1
            fi
            echo "Existing lifecycle helper already matches deploy source"
          else
            rm -f backup/includes/product_image_lifecycle.php
            echo "Lifecycle helper is new on production, as expected"
          fi

          sha256sum backup/admin/products.php backup/includes/functions.php backup/includes/automation.php > backup/sha256sums.txt
          if [ -f backup/includes/product_image_lifecycle.php ]; then
            sha256sum backup/includes/product_image_lifecycle.php >> backup/sha256sums.txt
          fi
          printf 'Pre-deploy Git base: %s\nDeploy commit: %s\n' "$PRE_DEPLOY_MAIN" "$GITHUB_SHA" > backup/manifest.txt

      - name: Upload pre-deploy backup evidence
        uses: actions/upload-artifact@v4
        with:
          name: product-image-predeploy-${{ github.run_id }}
          path: backup/
          if-no-files-found: error
          retention-days: 14

      - name: Deploy lifecycle helper first
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="${FTP_REMOTE_DIR#/}"; remote_dir="${remote_dir%/}"
          base_url="ftp://${FTP_HOST}/${remote_dir}"
          curl --silent --show-error --fail --connect-timeout 15 --max-time 90 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" --ftp-create-dirs \
            --upload-file public_html/includes/product_image_lifecycle.php \
            "${base_url}/includes/product_image_lifecycle.php"

      - name: Deploy functions and automation
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="${FTP_REMOTE_DIR#/}"; remote_dir="${remote_dir%/}"
          base_url="ftp://${FTP_HOST}/${remote_dir}"
          for path in includes/functions.php includes/automation.php; do
            curl --silent --show-error --fail --connect-timeout 15 --max-time 90 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "public_html/${path}" "${base_url}/${path}"
          done

      - name: Deploy admin products last
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="${FTP_REMOTE_DIR#/}"; remote_dir="${remote_dir%/}"
          base_url="ftp://${FTP_HOST}/${remote_dir}"
          curl --silent --show-error --fail --connect-timeout 15 --max-time 90 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file public_html/admin/products.php \
            "${base_url}/admin/products.php"

      - name: Verify production byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="${FTP_REMOTE_DIR#/}"; remote_dir="${remote_dir%/}"
          base_url="ftp://${FTP_HOST}/${remote_dir}"
          mkdir -p deployed/admin deployed/includes
          for path in admin/products.php includes/functions.php includes/automation.php includes/product_image_lifecycle.php; do
            curl --silent --show-error --fail --connect-timeout 15 --max-time 90 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              "${base_url}/${path}" --output "deployed/${path}"
            cmp "public_html/${path}" "deployed/${path}"
          done
          sha256sum deployed/admin/products.php deployed/includes/functions.php deployed/includes/automation.php deployed/includes/product_image_lifecycle.php > deploy-result/production-sha256sums.txt
          printf 'Commit: %s\nVerified byte-for-byte: yes\n' "$GITHUB_SHA" > deploy-result/summary.txt

      - name: Upload deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-image-production-${{ github.run_id }}
          path: |
            backup/
            deploy-result/
          if-no-files-found: warn
          retention-days: 14
