name: Product Image Memory Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/product-image-memory-production-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-backup-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: svth01.inwcloud.shop
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: public_html
      PRE_DEPLOY_MAIN: f14cacb0d4678780187c5515156f02f101e91afd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, mysqli, gd
          coverage: none

      - name: Validate deploy inputs and patch shape
        shell: bash
        run: |
          set -euo pipefail
          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD FTP_REMOTE_DIR; do
            test -n "${!name:-}"
          done
          for path in \
            public_html/includes/product_image_lifecycle.php \
            public_html/includes/functions.php \
            public_html/includes/automation.php \
            public_html/automation_runner.php \
            tests/product_image_lifecycle_test.php; do
            test -f "$path"
          done
          python3 - <<'PY'
          from pathlib import Path
          functions = Path('public_html/includes/functions.php').read_text()
          automation = Path('public_html/includes/automation.php').read_text()
          runner = Path('public_html/automation_runner.php').read_text()
          lifecycle = Path('public_html/includes/product_image_lifecycle.php').read_text()
          required = [
              ('memory plan', 'sakazukiProductImageOptimizationMemoryPlan' in lifecycle),
              ('preflight before legacy read', functions.find('sakazukiProductImageOptimizationMemoryPlan($width, $height, max(0, $size), 1024)') < functions.find('$bytes = @file_get_contents($source);') and functions.find('sakazukiProductImageOptimizationMemoryPlan($width, $height, max(0, $size), 1024)') >= 0),
              ('single optimizer image', 'sakazukiOptimizeLegacyProductImages(1)' in automation),
              ('optimizer interval', "'interval' => 300" in automation),
              ('fatal partial jobs', 'sakazuki_direct_partial_jobs' in runner),
              ('normal runtime memory', "'memory_usage_bytes' => max(0, (int) memory_get_usage(true))" in runner),
              ('maintenance version', "'maintenance_version'] = '2.3.0'" in runner),
          ]
          missing = [name for name, ok in required if not ok]
          if missing:
              raise SystemExit('memory-safety deploy shape missing: ' + ', '.join(missing))
          print('memory-safety deploy shape verified')
          PY

      - name: Re-run all PHP regressions
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$PRE_DEPLOY_MAIN"..HEAD -- . ':!.github/workflows/product-image-memory-production-deploy.yml'
          php tests/product_image_lifecycle_test.php
          failures=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! php -l "$file" >/tmp/php-lint.out 2>&1; then
              cat /tmp/php-lint.out
              failures=$((failures + 1))
            fi
          done < <(find public_html -type f -name '*.php' -print0)
          echo "PHP files checked: $count"
          test "$failures" -eq 0
          for test_file in tests/*.php; do php "$test_file"; done

      - name: Backup production and enforce no-drift preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup/includes deploy-result
          base_url="ftp://${FTP_HOST}/${FTP_REMOTE_DIR}"
          for path in includes/product_image_lifecycle.php includes/functions.php includes/automation.php automation_runner.php; do
            mkdir -p "backup/$(dirname "$path")"
            curl --silent --show-error --fail --connect-timeout 15 --max-time 90 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              "${base_url}/${path}" --output "backup/${path}"
            git show "${PRE_DEPLOY_MAIN}:public_html/${path}" > "/tmp/pre-${path//\//_}"
            if ! cmp -s "backup/${path}" "/tmp/pre-${path//\//_}"; then
              echo "Production drift detected before deploy: ${path}"
              echo "Refusing to overwrite a host file that differs from pre-deploy main."
              exit 1
            fi
          done
          sha256sum backup/includes/product_image_lifecycle.php backup/includes/functions.php backup/includes/automation.php backup/automation_runner.php > backup/sha256sums.txt
          printf 'Pre-deploy Git base: %s\nDeploy commit: %s\n' "$PRE_DEPLOY_MAIN" "$GITHUB_SHA" > backup/manifest.txt

      - name: Upload pre-deploy backup evidence
        uses: actions/upload-artifact@v4
        with:
          name: product-image-memory-predeploy-${{ github.run_id }}
          path: backup/
          if-no-files-found: error
          retention-days: 14

      - name: Deploy lifecycle helper first
        shell: bash
        run: |
          set -euo pipefail
          base_url="ftp://${FTP_HOST}/${FTP_REMOTE_DIR}"
          curl --silent --show-error --fail --connect-timeout 15 --max-time 90 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file public_html/includes/product_image_lifecycle.php \
            "${base_url}/includes/product_image_lifecycle.php"

      - name: Deploy functions and automation
        shell: bash
        run: |
          set -euo pipefail
          base_url="ftp://${FTP_HOST}/${FTP_REMOTE_DIR}"
          for path in includes/functions.php includes/automation.php; do
            curl --silent --show-error --fail --connect-timeout 15 --max-time 90 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "public_html/${path}" "${base_url}/${path}"
          done

      - name: Deploy automation runner last
        shell: bash
        run: |
          set -euo pipefail
          base_url="ftp://${FTP_HOST}/${FTP_REMOTE_DIR}"
          curl --silent --show-error --fail --connect-timeout 15 --max-time 90 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file public_html/automation_runner.php \
            "${base_url}/automation_runner.php"

      - name: Verify production byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          base_url="ftp://${FTP_HOST}/${FTP_REMOTE_DIR}"
          mkdir -p deployed/includes
          for path in includes/product_image_lifecycle.php includes/functions.php includes/automation.php automation_runner.php; do
            mkdir -p "deployed/$(dirname "$path")"
            curl --silent --show-error --fail --connect-timeout 15 --max-time 90 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              "${base_url}/${path}" --output "deployed/${path}"
            cmp "public_html/${path}" "deployed/${path}"
          done
          sha256sum deployed/includes/product_image_lifecycle.php deployed/includes/functions.php deployed/includes/automation.php deployed/automation_runner.php > deploy-result/production-sha256sums.txt
          printf 'Commit: %s\nVerified byte-for-byte: yes\n' "$GITHUB_SHA" > deploy-result/summary.txt

      - name: Upload deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-image-memory-production-${{ github.run_id }}
          path: |
            backup/
            deploy-result/
          if-no-files-found: warn
          retention-days: 14
