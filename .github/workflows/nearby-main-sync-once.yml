name: Nearby Main Integration Sync Once

on:
  push:
    branches:
      - feat/nearby-main-integration-public-20260925
    paths:
      - .github/workflows/nearby-main-sync-once.yml
      - .github/scripts/sync_nearby_main.py
      - .github/scripts/prepatch_nearby_heading.py

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch reviewed provider source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 'feat/nearby-main-slip-provider-20260924:refs/remotes/origin/nearby-reviewed'
          git show refs/remotes/origin/nearby-reviewed:public_html/includes/slip_nearby.php > public_html/includes/slip_nearby.php
          git show refs/remotes/origin/nearby-reviewed:tests/slip_nearby_test.php > tests/slip_nearby_test.php
          rm -f public_html/admin/slipverify.php
          rm -f .github/workflows/slipverify-production-deploy.yml

      - name: Prepatch reviewed settings heading
        run: python3 .github/scripts/prepatch_nearby_heading.py

      - name: Build reviewed main-flow integration
        id: build
        continue-on-error: true
        run: python3 .github/scripts/sync_nearby_main.py

      - name: Upload generated settings diagnostic
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: generated-settings-diagnostic
          path: public_html/admin/settings.php
          retention-days: 1

      - name: Stop on reviewed hash mismatch
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, mysqli, fileinfo
          coverage: none

      - name: Verify syntax, contract, and secrets
        shell: bash
        run: |
          set -euo pipefail
          php -l public_html/includes/functions.php
          php -l public_html/includes/slip_nearby.php
          php -l public_html/admin/settings.php
          php -l tests/slip_nearby_test.php
          php tests/slip_nearby_test.php
          python3 .github/scripts/secret_guard.py
          test ! -e public_html/admin/slipverify.php
          test ! -e .github/workflows/slipverify-production-deploy.yml
          git diff --check

      - name: Commit integration branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/prepatch_nearby_heading.py
          rm -f .github/scripts/sync_nearby_main.py
          rm -f .github/workflows/nearby-main-sync-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: integrate xNearby into main slip verification flow'
          git push origin HEAD:feat/nearby-main-integration-public-20260925
