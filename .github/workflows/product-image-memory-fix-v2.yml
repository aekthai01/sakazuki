name: Product Image Memory Safety Patch V2

on:
  push:
    branches:
      - fix/product-image-optimizer-memory-20260924
    paths:
      - ".github/workflows/product-image-memory-fix-v2.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fix/product-image-optimizer-memory-20260924
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, mysqli, gd
          coverage: none

      - name: Reuse guarded patch and fix generated test literals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/product-image-memory-fix.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Verify syntax and regressions"
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit('unable to locate guarded patch script')
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          Path('/tmp/product-image-memory-patch.py').write_text(textwrap.dedent(script))
          PY
          python3 /tmp/product-image-memory-patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/product_image_lifecycle_test.php')
          s = p.read_text()
          old = '''    is_string($automationRunner)
              && strpos($automationRunner, "'memory_limit_bytes' => function_exists('sakazukiPhpMemoryLimitBytes')") !== false
              && strpos($automationRunner, "'jobs' => (array) ($GLOBALS['sakazuki_direct_partial_jobs'] ?? [])") !== false,'''
          new = '''    is_string($automationRunner)
              && strpos($automationRunner, 'sakazukiPhpMemoryLimitBytes') !== false
              && strpos($automationRunner, 'sakazuki_direct_partial_jobs') !== false,'''
          if s.count(old) != 1:
              raise SystemExit(f'expected fatal diagnostic assertion once, found {s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''$preflightNeedle = "$memoryPlan = sakazukiProductImageOptimizationMemoryPlan($width, $height, max(0, $size), 1024);";'''
          new = '''$preflightNeedle = '$memoryPlan = sakazukiProductImageOptimizationMemoryPlan($width, $height, max(0, $size), 1024);';'''
          if s.count(old) != 1:
              raise SystemExit(f'expected preflight assertion once, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify all PHP and regressions
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          php tests/product_image_lifecycle_test.php
          failures=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! php -l "$file" >/tmp/php-lint.out 2>&1; then
              cat /tmp/php-lint.out
              failures=$((failures + 1))
            fi
          done < <(find public_html -type f -name '*.php' -print0)
          echo "PHP files checked: $count"
          test "$failures" -eq 0
          for test_file in tests/*.php; do php "$test_file"; done

      - name: Commit verified source changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public_html/includes/product_image_lifecycle.php public_html/includes/functions.php public_html/includes/automation.php public_html/automation_runner.php tests/product_image_lifecycle_test.php
          git commit -m "Make product image optimizer memory safe"
          git push origin HEAD:fix/product-image-optimizer-memory-20260924
