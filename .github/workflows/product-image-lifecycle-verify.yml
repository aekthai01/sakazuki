name: Product Image Lifecycle Verify

on:
  push:
    branches:
      - fix/product-image-lifecycle-20260924
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, mysqli
          coverage: none

      - name: Diff sanity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD

      - name: Lint all production PHP
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! php -l "$file" >/tmp/php-lint.out 2>&1; then
              cat /tmp/php-lint.out
              failures=$((failures + 1))
            fi
          done < <(find public_html -type f -name '*.php' -print0)
          echo "PHP files checked: $count"
          test "$failures" -eq 0

      - name: Lint repository tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find tests -type f -name '*.php' -print0)

      - name: Run product image lifecycle regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/product_image_lifecycle_test.php

      - name: Run existing repository regressions
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.php; do
            [ "$test_file" = "tests/product_image_lifecycle_test.php" ] && continue
            php "$test_file"
          done
