name: Product Image Runner Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/product-image-runner-production-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-backup-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_HOST: svth01.inwcloud.shop
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: public_html
      PRE_FIX_MAIN: 9e8d358651007a6905a1ca4541b49acd19ae7cfd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, mysqli
          coverage: none

      - name: Validate inputs and patch shape
        shell: bash
        run: |
          set -euo pipefail
          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD FTP_REMOTE_DIR; do
            test -n "${!name:-}"
          done
          test -f public_html/automation_runner.php
          test -f tests/product_image_lifecycle_test.php
          python3 - <<'PY'
          from pathlib import Path
          s = Path('public_html/automation_runner.php').read_text()
          expected = "$maintenanceJobs = ['cgo_catalog','shared_history','shared_binance_history','commerce_center','history_cleanup','product_image_cleanup','product_image_optimizer'];"
          if expected not in s:
              raise SystemExit('maintenance image jobs missing from runner')
          if "'product_image_cleanup','product_image_optimizer','admin_transaction_indexes'" not in s:
              raise SystemExit('image jobs missing from fatal-stage whitelist')
          print('runner image-job whitelist verified')
          PY

      - name: Re-run regression and syntax checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$PRE_FIX_MAIN"..HEAD -- . ':!.github/workflows/product-image-runner-production-deploy.yml'
          php -l public_html/automation_runner.php
          php tests/product_image_lifecycle_test.php
          failures=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! php -l "$file" >/tmp/php-lint.out 2>&1; then
              cat /tmp/php-lint.out
              failures=$((failures + 1))
            fi
          done < <(find public_html -type f -name '*.php' -print0)
          echo "PHP files checked: $count"
          test "$failures" -eq 0
          for test_file in tests/*.php; do php "$test_file"; done

      - name: Backup and preflight production runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup deploy-result
          base_url="ftp://${FTP_HOST}/${FTP_REMOTE_DIR}"
          curl --silent --show-error --fail --connect-timeout 15 --max-time 90 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "${base_url}/automation_runner.php" \
            --output backup/automation_runner.php
          git show "${PRE_FIX_MAIN}:public_html/automation_runner.php" > /tmp/pre-fix-runner.php
          cmp backup/automation_runner.php /tmp/pre-fix-runner.php
          sha256sum backup/automation_runner.php > backup/sha256sums.txt
          printf 'Pre-fix Git base: %s\nDeploy commit: %s\n' "$PRE_FIX_MAIN" "$GITHUB_SHA" > backup/manifest.txt

      - name: Upload pre-deploy backup
        uses: actions/upload-artifact@v4
        with:
          name: product-image-runner-predeploy-${{ github.run_id }}
          path: backup/
          if-no-files-found: error
          retention-days: 14

      - name: Deploy automation runner
        shell: bash
        run: |
          set -euo pipefail
          base_url="ftp://${FTP_HOST}/${FTP_REMOTE_DIR}"
          curl --silent --show-error --fail --connect-timeout 15 --max-time 90 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file public_html/automation_runner.php \
            "${base_url}/automation_runner.php"

      - name: Verify production runner byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          base_url="ftp://${FTP_HOST}/${FTP_REMOTE_DIR}"
          curl --silent --show-error --fail --connect-timeout 15 --max-time 90 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "${base_url}/automation_runner.php" \
            --output /tmp/deployed-automation-runner.php
          cmp public_html/automation_runner.php /tmp/deployed-automation-runner.php
          sha256sum /tmp/deployed-automation-runner.php > deploy-result/production-sha256sums.txt
          printf 'Commit: %s\nVerified byte-for-byte: yes\n' "$GITHUB_SHA" > deploy-result/summary.txt

      - name: Upload deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-image-runner-production-${{ github.run_id }}
          path: |
            backup/
            deploy-result/
          if-no-files-found: warn
          retention-days: 14
