name: Product Image Memory Postdeploy Smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/product-image-memory-postdeploy-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production HTTP surfaces
        shell: bash
        run: |
          set -euo pipefail
          health_code=$(curl --silent --show-error --location --max-time 20 -o /tmp/health.out -w '%{http_code}' 'https://sakazuki.spwz.online/health.php')
          test "$health_code" = '200'
          test -s /tmp/health.out

          root_code=$(curl --silent --show-error --location --max-time 20 -o /tmp/root.out -w '%{http_code}' 'https://sakazuki.spwz.online/')
          test "$root_code" = '200'
          test -s /tmp/root.out

          runner_code=$(curl --silent --show-error --max-time 20 -o /tmp/runner.out -w '%{http_code}' 'https://sakazuki.spwz.online/automation_runner.php?mode=maintenance')
          test "$runner_code" = '404'
          grep -F '"code":"not_found"' /tmp/runner.out >/dev/null

          echo "health_http=${health_code}"
          echo "root_http=${root_code}"
          echo "runner_unauthenticated_http=${runner_code}"
          echo "Production PHP surfaces responded as expected."
