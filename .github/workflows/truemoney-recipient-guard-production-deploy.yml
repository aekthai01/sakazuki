name: TrueMoney Recipient Guard Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - "public_html/includes/truemoney_byteindev_route.php"
      - "public_html/user/redeem_angpao.php"

permissions:
  contents: read

jobs:
  test-backup-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FTP_HOST: svth01.inwcloud.shop
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: public_html

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, mysqli
          coverage: none

      - name: Validate deploy inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done
          test -f public_html/includes/truemoney_byteindev.php
          test -f public_html/includes/truemoney_byteindev_route.php
          test -f public_html/user/redeem_angpao.php
          test -f tests/truemoney_byteindev_test.php
          test -f tests/truemoney_byteindev_routing_test.php

      - name: Run TrueMoney regression tests
        shell: bash
        run: |
          set -euo pipefail
          php -l public_html/includes/truemoney_byteindev.php
          php -l public_html/includes/truemoney_byteindev_route.php
          php -l public_html/user/redeem_angpao.php
          php -l tests/truemoney_byteindev_test.php
          php -l tests/truemoney_byteindev_routing_test.php
          php tests/truemoney_byteindev_test.php
          php tests/truemoney_byteindev_routing_test.php

      - name: Lint all production PHP
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! php -l "$file" >/tmp/php-lint.out 2>&1; then
              cat /tmp/php-lint.out
              failures=$((failures + 1))
            fi
          done < <(find public_html -type f -name '*.php' -print0)
          echo "PHP files checked: $count"
          if [ "$failures" -ne 0 ]; then
            echo "PHP syntax failures: $failures"
            exit 1
          fi

      - name: Live probe production TrueMoney backends
        shell: bash
        run: |
          set -euo pipefail
          providers=(
            'https://truemoney-voucher-nestjs.vercel.app'
            'https://truemoney-voucher-fastapi.vercel.app'
          )
          fake_code='SAKAZUKI_RECIPIENT_GUARD_DO_NOT_REDEEM'
          phone='0812345678'

          for base in "${providers[@]}"; do
            echo "Probing ${base}"
            status_http="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output /tmp/tmn-status.out --write-out '%{http_code}' "${base}/status")"
            if [ "$status_http" = '000' ] || [ "$status_http" -lt 200 ] || [ "$status_http" -ge 300 ]; then
              echo "Health probe failed for ${base}: HTTP ${status_http}"
              exit 1
            fi

            redeem_http="$(curl --silent --show-error --connect-timeout 10 --max-time 40 \
              --output /tmp/tmn-redeem.json --write-out '%{http_code}' \
              "${base}/truemoney/${fake_code}/${phone}")"
            if [ "$redeem_http" = '000' ] || [ "$redeem_http" -ge 500 ]; then
              echo "Redeem probe failed for ${base}: HTTP ${redeem_http}"
              exit 1
            fi

            python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/tmn-redeem.json').read_text(errors='replace'))
          if not isinstance(payload, dict):
              raise SystemExit('redeem probe response is not an object')
          status = payload.get('status')
          if isinstance(status, dict) and status.get('code') == 'SUCCESS':
              raise SystemExit('synthetic voucher unexpectedly succeeded')
          if not isinstance(status, dict) and 'code' not in payload:
              raise SystemExit('unrecognized redeem probe contract')
          print('Recognized fake-voucher response')
          PY
          done

      - name: Backup current production TrueMoney files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup deploy-result
          base="ftp://${FTP_HOST}/${FTP_REMOTE_DIR}"

          curl --silent --show-error --fail --connect-timeout 15 --max-time 60 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "${base}/includes/truemoney_byteindev_route.php" \
            --output backup/truemoney_byteindev_route.php
          curl --silent --show-error --fail --connect-timeout 15 --max-time 60 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "${base}/user/redeem_angpao.php" \
            --output backup/redeem_angpao.php

          sha256sum backup/truemoney_byteindev_route.php backup/redeem_angpao.php > backup/sha256sums.txt
          printf 'Commit before deploy: %s\nFiles backed up: 2\n' "$GITHUB_SHA" > backup/manifest.txt

      - name: Deploy recipient guard first
        shell: bash
        run: |
          set -euo pipefail
          base="ftp://${FTP_HOST}/${FTP_REMOTE_DIR}"
          curl --silent --show-error --fail --connect-timeout 15 --max-time 60 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --ftp-create-dirs \
            --upload-file public_html/includes/truemoney_byteindev_route.php \
            "${base}/includes/truemoney_byteindev_route.php"

      - name: Deploy tested redemption endpoint
        shell: bash
        run: |
          set -euo pipefail
          base="ftp://${FTP_HOST}/${FTP_REMOTE_DIR}"
          curl --silent --show-error --fail --connect-timeout 15 --max-time 60 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file public_html/user/redeem_angpao.php \
            "${base}/user/redeem_angpao.php"

      - name: Verify deployed file hashes
        shell: bash
        run: |
          set -euo pipefail
          base="ftp://${FTP_HOST}/${FTP_REMOTE_DIR}"
          mkdir -p /tmp/deployed

          curl --silent --show-error --fail --connect-timeout 15 --max-time 60 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "${base}/includes/truemoney_byteindev_route.php" \
            --output /tmp/deployed/truemoney_byteindev_route.php
          curl --silent --show-error --fail --connect-timeout 15 --max-time 60 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "${base}/user/redeem_angpao.php" \
            --output /tmp/deployed/redeem_angpao.php

          cmp public_html/includes/truemoney_byteindev_route.php /tmp/deployed/truemoney_byteindev_route.php
          cmp public_html/user/redeem_angpao.php /tmp/deployed/redeem_angpao.php
          sha256sum /tmp/deployed/truemoney_byteindev_route.php /tmp/deployed/redeem_angpao.php > deploy-result/production-sha256sums.txt
          printf 'Commit: %s\nDeployed UTC: %s\nFiles: 2\nVerified byte-for-byte: yes\n' \
            "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > deploy-result/summary.txt
          echo "Production file verification passed."

      - name: Upload backup and deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truemoney-recipient-guard-production-${{ github.run_id }}
          path: |
            backup/
            deploy-result/
          if-no-files-found: warn
          retention-days: 14
