name: Inspect SAK010.1 Archive Safety

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-sak010.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Inspect archive member names only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import PurePosixPath
          import tarfile

          secrets = {
              'private/cheatgame.php',
              'private/database.php',
              'private/key_reset_vault_secret.php',
              'private/purchase_activity_cache_v4.json',
              'private/recovery_mail_secret.php',
              'private/store_bridge_legacy_keys.php',
              'private/store_bridge_secret.php',
              'private/store_bridge_secret.php.lock',
              'private/xchetos.php',
              'public_html/includes/exchange_rate_cache.json',
          }

          found = []
          with tarfile.open('SAK010.1.tar.xz', 'r:xz') as tf:
              for member in tf.getmembers():
                  if not member.isfile():
                      continue
                  rel = PurePosixPath(member.name).as_posix().lstrip('./')
                  for secret in secrets:
                      if rel == secret or rel.endswith('/' + secret):
                          found.append(secret)

          print(f'Known secret/runtime paths present: {len(set(found))}')
          for item in sorted(set(found)):
              print('SECRET_PATH_PRESENT:', item)
          PY
