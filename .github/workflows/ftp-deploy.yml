name: FTP Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FTP_HOST: svth01.inwcloud.shop
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: public_html

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deploy source
        shell: bash
        run: |
          set -euo pipefail

          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD FTP_REMOTE_DIR; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required FTP setting: $name"
              exit 1
            fi
          done

          test -d public_html
          test -f public_html/includes/db.php

          if [ -e public_html/includes/exchange_rate_cache.json ]; then
            echo "Runtime cache must not be tracked in deploy source."
            exit 1
          fi

          if find public_html -type f -name '*.env' -print -quit | grep -q .; then
            echo "Blocked *.env file exists in deploy source."
            exit 1
          fi

          if [ -d public_html/assets/uploads ]; then
            while IFS= read -r file; do
              case "$file" in
                public_html/assets/uploads/.htaccess|\
                public_html/assets/uploads/icons/.htaccess|\
                public_html/assets/uploads/icons/index.php|\
                public_html/assets/uploads/products/.htaccess|\
                public_html/assets/uploads/products/index.php)
                  ;;
                *)
                  echo "Runtime/unexpected upload file is tracked in deploy source: $file"
                  exit 1
                  ;;
              esac
            done < <(find public_html/assets/uploads -type f -print)
          fi

          echo "Deploy source validation passed."

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          count=0

          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! php -l "$file" >/tmp/php-lint.out 2>&1; then
              cat /tmp/php-lint.out
              failures=$((failures + 1))
            fi
          done < <(find public_html -type f -name '*.php' -print0)

          echo "PHP files checked: $count"
          if [ "$failures" -ne 0 ]; then
            echo "PHP syntax failures: $failures"
            exit 1
          fi

      - name: Build deploy staging directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy-source
          cp -a public_html deploy-source

          rm -f deploy-source/includes/exchange_rate_cache.json
          find deploy-source -type f -name '*.env' -delete

          rm -rf deploy-source/assets/uploads
          mkdir -p deploy-source/assets/uploads/icons deploy-source/assets/uploads/products

          cp public_html/assets/uploads/.htaccess deploy-source/assets/uploads/.htaccess
          cp public_html/assets/uploads/icons/.htaccess deploy-source/assets/uploads/icons/.htaccess
          cp public_html/assets/uploads/icons/index.php deploy-source/assets/uploads/icons/index.php
          cp public_html/assets/uploads/products/.htaccess deploy-source/assets/uploads/products/.htaccess
          cp public_html/assets/uploads/products/index.php deploy-source/assets/uploads/products/index.php

          test -f deploy-source/includes/db.php
          echo "Deploy staging directory created."
          echo "Staged files: $(find deploy-source -type f | wc -l | tr -d ' ')"

      - name: Install lftp
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Deploy to production FTP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-result

          cat > /tmp/lftp-deploy.conf <<'EOF'
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 30
          set ftp:passive-mode true
          set ssl:verify-certificate true
          EOF

          lftp -f /tmp/lftp-deploy.conf -c "open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" ftp://$FTP_HOST; cd \"$FTP_REMOTE_DIR\"; mirror --reverse --verbose --parallel=4 --no-perms deploy-source ." \
            | tee deploy-result/ftp-deploy.log

          printf 'Source: deploy-source\nFTP host: %s\nRemote directory: %s\nCommit: %s\nDeployed (UTC): %s\nDelete remote files: no\nStaged files: %s\n' \
            "$FTP_HOST" "$FTP_REMOTE_DIR" "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "$(find deploy-source -type f | wc -l | tr -d ' ')" \
            > deploy-result/summary.txt

          echo "FTP production deploy completed successfully."

      - name: Verify FTP remains accessible
        shell: bash
        run: |
          set -euo pipefail
          host="${FTP_HOST#ftp://}"
          host="${host#ftps://}"
          host="${host%/}"

          curl \
            --silent \
            --show-error \
            --fail \
            --connect-timeout 15 \
            --max-time 45 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --list-only \
            "ftp://$host/$FTP_REMOTE_DIR/" \
            >/dev/null

          echo "FTP post-deploy access check passed."

      - name: Upload deploy result
        uses: actions/upload-artifact@v4
        with:
          name: ftp-deploy-result-${{ github.run_id }}
          path: deploy-result/
          if-no-files-found: error
          retention-days: 14
