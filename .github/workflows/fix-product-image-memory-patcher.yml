name: Fix Product Image Memory Patcher

on:
  push:
    branches:
      - fix/product-image-optimizer-memory-20260924
    paths:
      - ".github/workflows/fix-product-image-memory-patcher.yml"

permissions:
  contents: write

jobs:
  fix-patcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/product-image-optimizer-memory-20260924
      - name: Fix literal source assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/product-image-memory-fix.yml')
          s = p.read_text()
          old = '''              is_string($automationRunner)\n                  && strpos($automationRunner, "'memory_limit_bytes' => function_exists('sakazukiPhpMemoryLimitBytes')") !== false\n                  && strpos($automationRunner, "'jobs' => (array) ($GLOBALS['sakazuki_direct_partial_jobs'] ?? [])") !== false,'''
          new = '''              is_string($automationRunner)\n                  && strpos($automationRunner, 'sakazukiPhpMemoryLimitBytes') !== false\n                  && strpos($automationRunner, 'sakazuki_direct_partial_jobs') !== false,'''
          if s.count(old) != 1:
              raise SystemExit(f'expected fatal diagnostic assertion target once, found {s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''          $preflightNeedle = "$memoryPlan = sakazukiProductImageOptimizationMemoryPlan($width, $height, max(0, $size), 1024);";'''
          new = '''          $preflightNeedle = '$memoryPlan = sakazukiProductImageOptimizationMemoryPlan($width, $height, max(0, $size), 1024);';'''
          if s.count(old) != 1:
              raise SystemExit(f'expected preflight literal target once, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/product-image-memory-fix.yml
          git commit -m "Fix product image memory regression literals"
          git push origin HEAD:fix/product-image-optimizer-memory-20260924
