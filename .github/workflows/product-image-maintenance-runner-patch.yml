name: Product Image Maintenance Runner Patch

on:
  push:
    branches:
      - fix/product-image-maintenance-runner-20260924
    paths:
      - ".github/workflows/product-image-maintenance-runner-patch.yml"

permissions:
  contents: write

jobs:
  patch-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, mysqli
          coverage: none

      - name: Patch maintenance runner whitelist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public_html/automation_runner.php')
          s = p.read_text()
          old_stage = "            'cgo_catalog','shared_history','shared_binance_history','commerce_center','history_cleanup','admin_transaction_indexes',\n"
          new_stage = "            'cgo_catalog','shared_history','shared_binance_history','commerce_center','history_cleanup','product_image_cleanup','product_image_optimizer','admin_transaction_indexes',\n"
          old_jobs = "$maintenanceJobs = ['cgo_catalog','shared_history','shared_binance_history','commerce_center','history_cleanup'];"
          new_jobs = "$maintenanceJobs = ['cgo_catalog','shared_history','shared_binance_history','commerce_center','history_cleanup','product_image_cleanup','product_image_optimizer'];"
          if s.count(old_stage) != 1:
              raise SystemExit(f'expected exactly one fatal-stage whitelist target, found {s.count(old_stage)}')
          if s.count(old_jobs) != 1:
              raise SystemExit(f'expected exactly one maintenance whitelist target, found {s.count(old_jobs)}')
          s = s.replace(old_stage, new_stage, 1).replace(old_jobs, new_jobs, 1)
          p.write_text(s)
          PY

      - name: Verify image jobs are scheduled
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('public_html/automation_runner.php').read_text()
          needle = "$maintenanceJobs = ['cgo_catalog','shared_history','shared_binance_history','commerce_center','history_cleanup','product_image_cleanup','product_image_optimizer'];"
          if needle not in s:
              raise SystemExit('image maintenance jobs are not in maintenance runner whitelist')
          if "'product_image_cleanup','product_image_optimizer','admin_transaction_indexes'" not in s:
              raise SystemExit('image jobs are not in fatal-stage whitelist')
          print('maintenance runner contains both image jobs')
          PY
          php -l public_html/automation_runner.php
          php tests/product_image_lifecycle_test.php
          failures=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! php -l "$file" >/tmp/php-lint.out 2>&1; then
              cat /tmp/php-lint.out
              failures=$((failures + 1))
            fi
          done < <(find public_html -type f -name '*.php' -print0)
          echo "PHP files checked: $count"
          test "$failures" -eq 0
          for test_file in tests/*.php; do php "$test_file"; done
          git diff --check

      - name: Commit patched runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public_html/automation_runner.php
          git commit -m "Run product image cleanup in maintenance cron"
          git push origin HEAD:fix/product-image-maintenance-runner-20260924
